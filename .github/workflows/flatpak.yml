name: Flatpak

on:
  push:
    branches: [dev, main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [dev, main]

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container:
      # Image from flathub-infra/actions-images; the old
      # ghcr.io/flatpak/flatpak-github-actions images no longer exist.
      # kde-6.10 matches the manifest's org.kde.Platform runtime version.
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged

    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # github.ref_name contains a slash on pull_request events ("18/merge"),
      # which is invalid in a bundle filename — use the PR number instead.
      - name: Compute bundle name
        id: bundle
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: SinsGuide-${{ steps.bundle.outputs.name }}.flatpak
          manifest-path: packaging/io.github.jay9297.SinsGuide.yml
          cache-key: flatpak-${{ matrix.arch }}-${{ hashFiles('packaging/io.github.jay9297.SinsGuide.yml') }}
          arch: ${{ matrix.arch }}

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: SinsGuide-${{ steps.bundle.outputs.name }}-${{ matrix.arch }}
          path: SinsGuide-*.flatpak

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SinsGuide-*.flatpak
          generate_release_notes: true
