---
id: io.github.jay9297.SinsGuide
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: sins-guide

finish-args:
  # X11 for transparent overlay window
  - --socket=x11
  # IPC for Qt shared memory
  - --share=ipc
  # Wayland fallback (for XWayland Proton)
  - --socket=wayland
  # GPU access for screenshot capture (gem OCR)
  - --device=dri
  # Tesseract training data path (installed to /app/share/tessdata/)
  - --env=TESSDATA_PREFIX=/app/share/tessdata
  # Steam Proton prefix for Client.txt log parsing.
  # steam_discovery.py probes native and Flatpak Steam roots, and follows
  # libraryfolders.vdf into secondary libraries (SD card / extra drives
  # mount under /run/media on Steam Deck and Bazzite).
  - --filesystem=~/.steam:ro
  - --filesystem=~/.local/share/Steam:ro
  - --filesystem=~/.var/app/com.valvesoftware.Steam:ro
  - --filesystem=/run/media:ro

modules:
  # ── Leptonica (Tesseract image processing dependency) ──────────
  - name: leptonica
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.85.0/leptonica-1.85.0.tar.gz
        sha256: 3745ae3bf271a6801a2292eead83ac926e3a9bc1bf622e9cd4dd0f3786e17205
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake

  # ── Tesseract OCR (gem scanning) ───────────────────────────────
  - name: tesseract
    buildsystem: simple
    build-commands:
      - mkdir -p _build && cd _build && cmake .. -G"Unix Makefiles"
        -DCMAKE_INSTALL_PREFIX=/app -DBUILD_TRAINING_TOOLS=OFF
      - cd _build && make -j$(nproc)
      - cd _build && make install
      - install -d /app/share/tessdata && cp eng.traineddata /app/share/tessdata/
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/5.5.0.tar.gz
        sha256: f2fb34ca035b6d087a42875a35a7a5c4155fa9979c6132365b1e5a28ebc3fc11
      - type: file
        url: https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata
        sha256: daa0c97d651c19fba3b25e81317cd697e9908c8208090c94c3905381c23fc047
    cleanup:
      - /include
      - /share/doc
      - /lib64/libtesseract.a

  # ── Python runtime dependencies (offline, SHA256-verified) ─────
  - name: python3-dependencies
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index
        --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        --no-build-isolation
        pynput requests python-xlib pytesseract Pillow
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/a5/f5/397b61091120a9ca5001041dd7bf76c385b3bfd67a0e5bcb74b852bd22a4/evdev-1.9.3.tar.gz
        sha256: 2c140e01ac8437758fa23fe5c871397412461f42d421aa20241dc8fe8cfccbc9
      - type: file
        url: https://files.pythonhosted.org/packages/6d/98/bbeb760852adb27f166ce1617f0e51aabb15f21b1e60ea703f2aed3c78ac/pynput-1.8.2-py2.py3-none-any.whl
        sha256: 8cc38cf13a6ab2749cb375678be8a0fd705d7ce49c8001ff5db4007a723bbef1
      - type: file
        url: https://files.pythonhosted.org/packages/db/8f/61959034484a4a7c527811f4721e75d02d653a35afb0b6054474d8185d4c/charset_normalizer-3.4.7-py3-none-any.whl
        sha256: 3dce51d0f5e7951f8bb4900c257dad282f49190fdbebecd4ba99bcc41fef404d
      - type: file
        url: https://files.pythonhosted.org/packages/1e/5e/d4e9f1a599fb8e573b7b87160658329fbf28d19eac2718f51fc3def3aa5a/idna-3.18-py3-none-any.whl
        sha256: 7f952cbe720b688055e3f87de14f5c3e5fdaa8bc3928985c4077ca689de849a2
      - type: file
        url: https://files.pythonhosted.org/packages/a0/f4/c67b0b3f1b9245e8d266f0f112c500d50e5b4e83cb6f3b71b6528104182a/requests-2.34.2-py3-none-any.whl
        sha256: 2a0d60c172f83ac6ab31e4554906c0f3b3588d37b5cb939b1c061f4907e278e0
      - type: file
        url: https://files.pythonhosted.org/packages/7f/3e/5db95bcf282c52709639744ca2a8b149baccf648e39c8cc87553df9eae0c/urllib3-2.7.0-py3-none-any.whl
        sha256: 9fb4c81ebbb1ce9531cce37674bbc6f1360472bc18ca9a553ede278ef7276897
      - type: file
        url: https://files.pythonhosted.org/packages/fc/b8/ff33610932e0ee81ae7f1269c890f697d56ff74b9f5b2ee5d9b7fa2c5355/python_xlib-0.33-py2.py3-none-any.whl
        sha256: c3534038d42e0df2f1392a1b30a15a4ff5fdc2b86cfa94f072bf11b10a164398
      - type: file
        url: https://files.pythonhosted.org/packages/67/ee/21d4e8536afd1a328f01b359b4d3997b291ffd35a237c877b331c1c3b71c/pillow-12.2.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: eedf4b74eda2b5a4b2b2fb4c006d6295df3bf29e459e198c90ea48e130dc75c3
      - type: file
        url: https://files.pythonhosted.org/packages/7a/33/8312d7ce74670c9d39a532b2c246a853861120486be9443eebf048043637/pytesseract-0.3.13-py3-none-any.whl
        sha256: 7a99c6c2ac598360693d83a416e36e0b33a67638bb9d77fdcac094a3589d4b34
      - type: file
        url: https://files.pythonhosted.org/packages/59/8c/57e832b7af6d7c5abe66eb3fbe3a3a32f4d11ea23a1aa7131371035be991/certifi-2026.5.20-py3-none-any.whl
        sha256: 3c52e209ba0a4ad7aebe60436a4ab349c39e1e602e8c134221e546902ad25897
      - type: file
        url: https://files.pythonhosted.org/packages/b7/ce/149a00dd41f10bc29e5921b496af8b574d8413afcd5e30dfa0ed46c2cc5e/six-1.17.0-py2.py3-none-any.whl
        sha256: 4721f391ed90541fddacab5acf947aa0d3dc7d27b2e1e8eda2be8970586c3274
      - type: file
        url: https://files.pythonhosted.org/packages/df/b2/87e62e8c3e2f4b32e5fe99e0b86d576da1312593b39f47d8ceef365e95ed/packaging-26.2-py3-none-any.whl
        sha256: 5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e

  # ── PySide6 (separate; pip-generator refuses to handle Qt wheels,
  #    so the wheels are listed manually — offline, SHA256-verified) ──
  - name: python3-pyside
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index
        --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        --no-build-isolation
        PySide6-Essentials==6.11.1 shiboken6==6.11.1
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/5c/49/0e1237c4400bec7e335d2c4eeb49bc40d9fd88a9ac44ca9083ce1abdc308/pyside6_essentials-6.11.1-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: e3ef7027b41e4e55fadb56e3b3257dc8ee92154b639fe67fc4c8e05e9d976c60
      - type: file
        url: https://files.pythonhosted.org/packages/c7/9b/e0355d8897b5c150770f1d95718aad17d432fcc9c035c04f3f58427d4693/shiboken6-6.11.1-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: 9a8bccfafc8805254cabcfa1edfaf55cd52889f4998c91ad0d9a4433fb1bcdbe

  # ── Sin's Guide application ────────────────────────────────────
  - name: sins-guide
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps .
      - install -Dm644 packaging/io.github.jay9297.SinsGuide.desktop
        ${FLATPAK_DEST}/share/applications/io.github.jay9297.SinsGuide.desktop
      - install -Dm644 packaging/io.github.jay9297.SinsGuide.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/io.github.jay9297.SinsGuide.metainfo.xml
      - install -Dm644 packaging/io.github.jay9297.SinsGuide.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.jay9297.SinsGuide.svg
    sources:
      - type: dir
        path: ../
